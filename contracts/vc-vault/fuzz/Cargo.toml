[workspace]

[package]
name = "vc-vault-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.vc-vault-contract]
path = ".."

[dependencies.soroban-sdk]
version = "23.4.0"
features = ["testutils"]

# Disable default features to speed up build; re-enable only what fuzz targets need.
[profile.release]
opt-level = 3
debug = false

[[bin]]
name = "fuzz_issue"
path = "fuzz_targets/fuzz_issue.rs"
test = false
doc = false

[[bin]]
name = "fuzz_revoke"
path = "fuzz_targets/fuzz_revoke.rs"
test = false
doc = false

[[bin]]
name = "fuzz_verify_vc"
path = "fuzz_targets/fuzz_verify_vc.rs"
test = false
doc = false

[[bin]]
name = "fuzz_push"
path = "fuzz_targets/fuzz_push.rs"
test = false
doc = false

[[bin]]
name = "fuzz_issuer_ops"
path = "fuzz_targets/fuzz_issuer_ops.rs"
test = false
doc = false

[[bin]]
name = "fuzz_lifecycle"
path = "fuzz_targets/fuzz_lifecycle.rs"
test = false
doc = false
